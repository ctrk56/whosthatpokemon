<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheap Flights Finder</title>
<meta name="description" content="Chat with an agent that finds the lowest cash fares from airports near Tracy, CA.">
<style>
  :root { --bg:#f7f8fa; --panel:#fff; --text:#1a1d23; --muted:#667085; --line:#e3e6ec; --accent:#0b6bcb; --accent-text:#fff; --user:#e8f1fc; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111418; --panel:#1a1f26; --text:#e8eaee; --muted:#9aa3b2; --line:#2b323c; --accent:#4c9aff; --accent-text:#08111d; --user:#1c2b3f; --err:#ff8a80; } }
  :root[data-theme="dark"] { --bg:#111418; --panel:#1a1f26; --text:#e8eaee; --muted:#9aa3b2; --line:#2b323c; --accent:#4c9aff; --accent-text:#08111d; --user:#1c2b3f; --err:#ff8a80; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100dvh; display:flex; flex-direction:column; }
  header, form, #log { width:100%; max-width:860px; margin:0 auto; padding-left:16px; padding-right:16px; }
  header { padding-top:20px; padding-bottom:8px; }
  h1 { font-size:1.25rem; margin:0 0 2px; }
  header p { margin:0; color:var(--muted); font-size:.9rem; }
  #log { flex:1; overflow-y:auto; padding-top:12px; padding-bottom:12px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); overflow-x:auto; word-wrap:break-word; }
  .msg.user { background:var(--user); align-self:flex-end; max-width:90%; }
  .msg.err { color:var(--err); }
  .msg p { margin:0 0 .6em; } .msg p:last-child { margin-bottom:0; }
  .msg table { border-collapse:collapse; font-size:.88rem; margin:.4em 0; }
  .msg th, .msg td { border:1px solid var(--line); padding:6px 8px; text-align:left; white-space:nowrap; }
  .msg a { color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:8px 12px; cursor:pointer; font:inherit; font-size:.88rem; }
  form { display:flex; gap:8px; padding-top:8px; padding-bottom:16px; }
  textarea { flex:1; resize:none; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  #send { background:var(--accent); color:var(--accent-text); border:0; border-radius:10px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  button:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; padding:0 16px 14px; }
</style>
</head>
<body>
<header>
  <h1>Cheap Flights Finder</h1>
  <p>Lowest cash fares from SCK, SMF, OAK, SFO and SJC (near Tracy, CA). Search only: you book on the airline's site.</p>
</header>
<main id="log" aria-live="polite">
  <div class="msg">Where do you want to go, and when? Flexible dates are fine.
    <div class="chips" style="margin-top:10px">
      <button type="button">Cheapest round trip to Los Angeles, Dec 10 to Dec 14</button>
      <button type="button">One way to Denver next Friday</button>
      <button type="button">Nonstop to Las Vegas, Jan 8 to Jan 11</button>
    </div>
  </div>
</main>
<form id="form">
  <textarea id="input" rows="2" maxlength="2000" placeholder="e.g. Cheapest round trip to Seattle, Jan 15 to Jan 20" aria-label="Your message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<footer>Prices are quotes from Ignav and can change or expire before you book. Buses are excluded.</footer>
<script src="config.js"></script>
<script>
(() => {
  const log = document.getElementById("log"), form = document.getElementById("form"),
        input = document.getElementById("input"), send = document.getElementById("send");
  const history = [];

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  // Minimal, safe markdown: escape first, then allow bold, links (http/https only), tables, lists.
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  }
  function render(md) {
    const lines = md.split("\n"), out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
        const row = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        let t = "<table><thead><tr>" + row(l).map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
        i += 2;
        for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) t += "<tr>" + row(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
        i--; out.push(t + "</tbody></table>");
      } else if (/^\s*[-*] /.test(l)) {
        let t = "<ul>";
        for (; i < lines.length && /^\s*[-*] /.test(lines[i]); i++) t += `<li>${inline(lines[i].replace(/^\s*[-*] /, ""))}</li>`;
        i--; out.push(t + "</ul>");
      } else if (l.trim()) {
        out.push(`<p>${inline(l.replace(/^#+\s*/, ""))}</p>`);
      }
    }
    return out.join("");
  }

  function add(cls, html) {
    const d = document.createElement("div");
    d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d);
    log.scrollTop = log.scrollHeight; return d;
  }

  async function ask(text) {
    add("user", `<p>${esc(text)}</p>`);
    history.push({ role: "user", content: text });
    send.disabled = true;
    const pending = add("", "<p>Searching fares…</p>");
    try {
      const res = await fetch(window.FLIGHT_API + "/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-20) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      history.push({ role: "assistant", content: data.reply });
      pending.innerHTML = render(data.reply);
    } catch (e) {
      history.pop();
      pending.className = "msg err"; pending.textContent = e.message || "Something went wrong.";
    } finally { send.disabled = false; input.focus(); log.scrollTop = log.scrollHeight; }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); const t = input.value.trim(); if (t && !send.disabled) { input.value = ""; ask(t); } });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => { input.value = b.textContent; form.requestSubmit(); }));
})();
</script>
</body>
</html>
